backend:
  name: github
  repo: kaliguri/Posleslovie
  branch: main
  base_url: https://posleslovie-cms-auth.kailgurika.workers.dev

media_folder: public/images
public_folder: /images

media_library:
  config:
    folder_support: true

collections:
  - name: site
    label: Сайт - общие настройки
    files:
      - name: site_settings
        label: 01. Бренд и контакты
        file: content/site-settings.json
        fields:
          - name: favicon
            label: Иконка сайта (favicon)
            widget: image
            required: false
            hint: "Иконка во вкладке браузера. Рекомендуется квадрат 512x512 px, формат PNG или SVG. Если поле пустое, иконка не используется."
          - {
              name: name,
              label: Название сайта (бренд),
              widget: string,
              hint: "Короткое имя бренда. Показывается во вкладке браузера после «—» и в служебных местах. Например: Послесловие.",
            }
          - {
              name: seoTitle,
              label: Заголовок в поиске (SEO title),
              widget: string,
              required: false,
              hint: "Синяя ссылка-заголовок в результатах Google/Яндекса и заголовок при репосте в соцсети. Оптимально 50–60 символов, добавьте город и суть. Если пусто — берётся «Название сайта».",
              pattern: ["^.{0,70}$", "Слишком длинный заголовок: не более 70 символов"],
            }
          - {
              name: description,
              label: Описание в поиске (SEO description),
              widget: text,
              hint: "Текст под заголовком в результатах поиска. Оптимально 140–160 символов. Внимание: поисковики иногда показывают вместо него текст с первого экрана сайта — это нормально.",
              pattern: ["^.{0,200}$", "Слишком длинное описание: не более 200 символов"],
            }
          - {
              name: phone,
              label: Телефон,
              widget: string,
              hint: "Формат +7XXXXXXXXXX или +7 (XXX) XXX-XX-XX.",
              pattern: ["^\\+7[\\d\\s()\\-]{10,}$", "Введите телефон в формате +7..."],
            }
          - {
              name: email,
              label: Email,
              widget: string,
              hint: "Основной контактный email.",
              pattern: ["^[^\\s@]+@[^\\s@]+\\.[^\\s@]+$", "Введите корректный email"],
            }
          - {
              name: ownerName,
              label: ИП (ФИО),
              widget: string,
              required: false,
              hint: "Например: Серебренникова Полина Кирилловна. Показывается в блоке «Контакты». Оставьте пустым, чтобы скрыть.",
            }
          - {
              name: address,
              label: Адрес,
              widget: string,
              required: false,
              hint: "Юридический/почтовый адрес. Показывается в блоке «Контакты». Оставьте пустым, чтобы скрыть.",
            }
          - {
              name: inn,
              label: ИНН,
              widget: string,
              required: false,
              hint: "ИНН. Показывается в блоке «Контакты». Оставьте пустым, чтобы скрыть.",
            }
          - {
              name: ogrnip,
              label: ОГРНИП,
              widget: string,
              required: false,
              hint: "ОГРНИП. Показывается в блоке «Контакты». Оставьте пустым, чтобы скрыть.",
            }
          - name: socials
            label: Социальные сети
            widget: list
            summary: "{{fields.label}} -> {{fields.href}}"
            hint: Для иконок в шапке используйте VK, TG и MAX.
            min: 3
            max: 3
            fields:
              - name: label
                label: Название
                widget: select
                options: ["VK", "TG", "MAX"]
              - {
                  name: href,
                  label: Ссылка,
                  widget: string,
                  pattern: ["^https?://", "Ссылка должна начинаться с http:// или https://"],
                }
              - name: icon
                label: Иконка
                widget: image
                required: false
                media_folder: public/images/social
                public_folder: /images/social
                hint: "PNG/SVG. Если поле пустое, используется стандартная иконка сети."

      - name: legal_documents
        label: 02. Юридические документы (PDF)
        file: content/legal-documents.json
        fields:
          - name: documents
            label: Документы
            widget: list
            summary: "{{fields.shortTitle}}"
            hint: Редактируйте только короткое название и PDF-файл. Существующие документы не удаляйте.
            fields:
              - { name: slug, widget: hidden }
              - name: pdfPath
                label: PDF-файл документа
                widget: file
                media_folder: public/images/documents
                public_folder: /images/documents
                hint: Загрузите PDF, чтобы ссылка в футере обновилась автоматически.
                pattern:
                  - "\\.pdf$"
                  - "Разрешены только PDF-файлы"
              - { name: title, widget: hidden }
              - {
                  name: shortTitle,
                  label: Короткое название,
                  widget: string,
                  hint: "Отображается в футере в списке документов.",
                }

      - name: products
        label: 03. Товары
        file: content/site-products.json
        fields:
          - name: items
            label: Карточки товаров
            widget: list
            summary: "{{fields.title}} — {{fields.price}} ₽"
            hint: "Добавляйте и удаляйте товары. В корзине сейчас используется первый товар в списке."
            fields:
              - { name: title, label: Название товара, widget: string }
              - { name: price, label: Стоимость (₽), widget: number, value_type: int, min: 0 }
              - {
                  name: image,
                  label: Фото товара,
                  widget: image,
                  hint: "Рекомендуемый размер: 1200x1200 px (квадрат).",
                }

      - name: site_behavior
        label: 04. Настройки
        file: content/site-behavior.json
        fields:
          - {
              name: enableScrollAnimations,
              label: Включить анимацию блоков при прокрутке,
              widget: boolean,
              default: true,
              hint: "Если выключить, секции будут появляться без анимации.",
            }
          - {
              name: enableGlobalOverlays,
              label: Включить затемняющие слои на сайте,
              widget: boolean,
              default: false,
              hint: "Глобально управляет затемнением фоновых изображений и затемнением подложек меню/модалок.",
            }

      - name: cms_quick_start
        label: 98. Как пользоваться CMS - быстрый старт
        file: content/cms-quick-start.md
        editor:
          preview: false
        fields:
          - {
              name: title,
              label: Заголовок,
              widget: string,
              hint: "Служебное поле. Лучше не менять.",
            }
          - {
              name: body,
              label: Быстрый старт,
              widget: markdown,
              hint: "Краткая инструкция для ежедневной работы клиента.",
            }

      - name: cms_full_guide
        label: 99. Как пользоваться CMS - полный гайд
        file: content/cms-full-guide.md
        editor:
          preview: false
        fields:
          - {
              name: title,
              label: Заголовок,
              widget: string,
              hint: "Служебное поле. Лучше не менять.",
            }
          - {
              name: body,
              label: Полный гайд,
              widget: markdown,
              hint: "Подробная инструкция и решения частых ошибок.",
            }

  - name: home
    label: Главная страница (сверху вниз)
    media_folder: public/images/photos
    public_folder: /images/photos
    files:
      - name: hero
        label: "Блок #1. Первый экран (обложка)"
        file: content/home-hero.json
        fields:
          - { name: heading, label: Главный заголовок, widget: string }
          - { name: leadLine1, label: Подзаголовок — строка 1, widget: string }
          - { name: leadLine2, label: Подзаголовок — строка 2, widget: string }
          - { name: ctaLabel, label: Текст кнопки на первом экране, widget: string }
          - name: backgroundMediaType
            label: Что использовать в фоне
            widget: select
            default: image
            options:
              - { label: Изображение, value: image }
              - { label: Видео, value: video }
            hint: Выберите, что показывать на обложке - изображение или видео.
          - {
              name: backgroundImage,
              label: Фоновое изображение,
              widget: image,
              hint: "Рекомендуемый размер: 1920x1080 px.",
            }
          - name: backgroundVideo
            label: Фоновое видео (mp4/webm)
            widget: file
            required: false
            media_folder: public/images/videos
            public_folder: /images/videos
            hint: "Рекомендуемый размер: 1920x1080 px (16:9). Видео будет зациклено и запущено без звука."
            pattern:
              - "^$|\\.(mp4|webm)$"
              - "Оставьте пустым или загрузите видео MP4 / WEBM"

      - name: feature_cards
        label: "Блок #2. Карточки преимуществ"
        file: content/home-feature-cards.json
        fields:
          - { name: sectionTitle, label: Заголовок блока, widget: string }
          - name: cards
            label: Карточки преимуществ
            widget: list
            summary: "{{fields.title}}"
            max: 6
            fields:
              - { name: title, label: Название, widget: string }
              - { name: description, label: Описание, widget: text }
              - {
                  name: icon,
                  label: Иконка,
                  widget: image,
                  hint: "Рекомендуемый размер: 128x128 px (квадрат).",
                }

      - name: process_bombs
        label: "Блок #3. Как мы делаем бомбочки"
        file: content/home-process-bombs.json
        fields:
          - { name: eyebrow, label: Надпись над заголовком, widget: string }
          - { name: title, label: Заголовок блока, widget: string }
          - { name: description, label: Описание, widget: text }
          - {
              name: reverse,
              label: Зеркальная компоновка,
              widget: boolean,
              default: false,
              hint: "Включите, чтобы поменять местами блок текста и блок фото.",
            }
          - name: slides
            label: Изображения блока
            widget: list
            summary: "{{fields.alt}}"
            max: 12
            fields:
              - {
                  name: image,
                  label: Изображение,
                  widget: image,
                  hint: "Рекомендуемый размер: 1200x1200 px (квадрат).",
                }
              - {
                  name: alt,
                  label: Описание изображения (alt),
                  widget: string,
                  required: true,
                  hint: "Коротко опишите, что изображено на фото.",
                }
          - {
              name: button,
              label: Текст кнопки (оставьте пустым,
              чтобы скрыть),
              widget: string,
              required: false,
            }

      - name: process_lavender
        label: "Блок #4. Собираем лаванду вручную"
        file: content/home-process-lavender.json
        fields:
          - { name: eyebrow, label: Надпись над заголовком, widget: string }
          - { name: title, label: Заголовок блока, widget: string }
          - { name: description, label: Описание, widget: text }
          - {
              name: reverse,
              label: Зеркальная компоновка,
              widget: boolean,
              default: false,
              hint: "Включите, чтобы поменять местами блок текста и блок фото.",
            }
          - name: slides
            label: Изображения блока
            widget: list
            summary: "{{fields.alt}}"
            max: 12
            fields:
              - {
                  name: image,
                  label: Изображение,
                  widget: image,
                  hint: "Рекомендуемый размер: 1200x1200 px (квадрат).",
                }
              - {
                  name: alt,
                  label: Описание изображения (alt),
                  widget: string,
                  required: true,
                  hint: "Коротко опишите, что изображено на фото.",
                }
          - {
              name: button,
              label: Текст кнопки (оставьте пустым,
              чтобы скрыть),
              widget: string,
              required: false,
            }

      - name: process_packs
        label: "Блок #5. Упаковываем с любовью"
        file: content/home-process-packs.json
        fields:
          - { name: eyebrow, label: Надпись над заголовком, widget: string }
          - { name: title, label: Заголовок блока, widget: string }
          - { name: description, label: Описание, widget: text }
          - {
              name: reverse,
              label: Зеркальная компоновка,
              widget: boolean,
              default: false,
              hint: "Включите, чтобы поменять местами блок текста и блок фото.",
            }
          - name: slides
            label: Изображения блока
            widget: list
            summary: "{{fields.alt}}"
            max: 12
            fields:
              - {
                  name: image,
                  label: Изображение,
                  widget: image,
                  hint: "Рекомендуемый размер: 1200x1200 px (квадрат).",
                }
              - {
                  name: alt,
                  label: Описание изображения (alt),
                  widget: string,
                  required: true,
                  hint: "Коротко опишите, что изображено на фото.",
                }
          - {
              name: button,
              label: Текст кнопки (оставьте пустым,
              чтобы скрыть),
              widget: string,
              required: false,
            }

      - name: why_us
        label: "Блок #6. Почему выбирают нас"
        file: content/home-why-us.json
        fields:
          - { name: kicker, label: Надпись над заголовком, widget: string }
          - { name: title, label: Заголовок блока, widget: string }
          - {
              name: backgroundImage,
              label: Фоновое изображение,
              widget: image,
              hint: "Рекомендуемый размер: 1600x900 px.",
            }
          - name: reasons
            label: Карточки причин
            widget: list
            summary: "{{fields.title}}"
            max: 6
            fields:
              - { name: title, label: Заголовок, widget: string }
              - { name: description, label: Описание, widget: text }
              - {
                  name: icon,
                  label: Иконка,
                  widget: image,
                  hint: "Рекомендуемый размер: 128x128 px (квадрат).",
                }

      - name: about
        label: "Блок #7. О нас"
        file: content/home-about.json
        fields:
          - { name: kicker, label: Надпись над заголовком, widget: string }
          - { name: title, label: Заголовок блока, widget: string }
          - name: paragraphs
            label: Параграфы текста
            widget: list
            max: 8
            field: { name: text, label: Текст, widget: text }
          - {
              name: image,
              label: Изображение,
              widget: image,
              hint: "Рекомендуемый размер: 900x1200 px (вертикальное).",
            }

      - name: reviews
        label: "Блок #8. Отзывы клиентов"
        file: content/home-reviews.json
        fields:
          - { name: kicker, label: Надпись над заголовком, widget: string }
          - { name: title, label: Заголовок блока, widget: string }
          - name: items
            label: Отзывы
            widget: list
            summary: "{{fields.name}}"
            max: 10
            fields:
              - { name: name, label: Имя автора, widget: string }
              - name: mediaType
                label: Что показывать в отзыве
                widget: select
                default: image
                options:
                  - { label: Картинка, value: image }
                  - { label: Видео, value: video }
                hint: Выберите, показывать картинку или видео с превью.
              - {
                  name: image,
                  label: Картинка / превью видео,
                  widget: image,
                  hint: "Рекомендуемый размер: 400x400 px (квадрат).",
                }
              - name: video
                label: Видео отзыва (mp4/webm)
                widget: file
                required: false
                media_folder: public/images/videos
                public_folder: /images/videos
                hint: "Если выбран режим Видео, загрузите файл видео."
                pattern:
                  - "^$|\\.(mp4|webm)$"
                  - "Оставьте пустым или загрузите видео MP4 / WEBM"
              - { name: text, label: Текст отзыва, widget: text }

      - name: faq
        label: "Блок #9. Ответы на вопросы (FAQ)"
        file: content/home-faq.json
        fields:
          - { name: kicker, label: Надпись над заголовком, widget: string }
          - { name: title, label: Заголовок блока, widget: string }
          - name: items
            label: Вопросы и ответы
            widget: list
            summary: "{{fields.question}}"
            max: 20
            fields:
              - { name: question, label: Вопрос, widget: string }
              - { name: answer, label: Ответ, widget: text }

      - name: cta
        label: "Блок #10. Нижний баннер с кнопкой"
        file: content/home-cta.json
        fields:
          - { name: heading, label: Заголовок баннера, widget: string }
          - { name: text, label: Текст под заголовком, widget: text }
          - { name: buttonLabel, label: Текст кнопки баннера, widget: string }
          - {
              name: backgroundImage,
              label: Фоновое изображение,
              widget: image,
              hint: "Рекомендуемый размер: 1920x1080 px.",
            }
